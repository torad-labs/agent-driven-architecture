# ── CI — the gate, on every push (15.1/17.4) ────────────────────────────────
# §17.4 used to admit "nothing runs them on push: there is no CI" — a book that
# stakes its answer on machine enforcement was itself enforced only on whoever
# remembered to run the suites. This closes that. Do not go looking for the
# receipt in that section any more: it reports on no codebase at all now, and
# each port's README states its own enforcement rung and names this workflow.
# Both jobs run the SAME entry points a contributor runs locally (`npm test`,
# `./gradlew check`), so green here means exactly what green means on a laptop
# — no CI-only rule set, no warning tier, no baseline.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code to build and test it. The
# blanket org policy zizmor enforces flags the absence of this block, and the
# default token is broader than either job needs.
permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript — npm test (typecheck + gate + biome + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  kotlin:
    name: Kotlin — ./gradlew check (konsist + detekt + compiler proofs + junit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew check --console=plain
