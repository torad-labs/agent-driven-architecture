# ── CI — the gate, on every push (15.1/17.4) ────────────────────────────────
# §17.4 used to admit "nothing runs them on push: there is no CI" — a book that
# stakes its answer on machine enforcement was itself enforced only on whoever
# remembered to run the suites. This closes that. Do not go looking for the
# receipt in that section any more: it reports on no codebase at all now, and
# each port's README states its own enforcement rung and names this workflow.
# Both jobs run the SAME entry points a contributor runs locally (`npm test`,
# `./gradlew check`), so green here means exactly what green means on a laptop
# — no CI-only rule set, no warning tier, no baseline.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code to build and test it. The
# blanket org policy zizmor enforces flags the absence of this block, and the
# default token is broader than either job needs.
permissions:
  contents: read

# T7 (dev/gates/ci-hygiene.ts). A push to a branch with a run already in flight used to leave both
# running: the older one keeps a runner busy and its verdict lands SECOND, so a red-then-fixed
# sequence can report red last. Cancelling in-progress runs makes the newest commit the one whose
# verdict is final. Never cancel on `main` — a cancelled push-to-main leaves the branch with no
# verdict at all, which reads identically to "not yet run".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript:
    name: TypeScript — npm test (typecheck + gate + biome + vitest)
    runs-on: ubuntu-latest
    # T1 (dev/gates/ci-hygiene.ts). Without this a hung step burns the full 6-hour default before
    # anyone learns the gate never answered — and a gate that has not answered is not a green one.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  kotlin:
    name: Kotlin — ./gradlew check (konsist + detekt + compiler proofs + junit)
    runs-on: ubuntu-latest
    # Higher than the TypeScript job: a cold Gradle cache plus konsist and detekt is the slow path
    # here, and a ceiling that trips on an ordinary cold run is a ceiling that gets deleted.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew check --console=plain
