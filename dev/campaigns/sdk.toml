phase = "env"
title = "TWO SUMMARY CONCERNS FROM THE REVIEW, both fixed. (1) demo.ts printed turn.text as the answer regardless of finishReason, so a TRUNCATED response rendered identically to a complete one - the exact confusion SDK-2 widened the seam to end. It now prints finishReason and total tokens. (2) VERIFICATION RACE: test/gate/gate.test.ts walked into .work/quickstart-walk while test/laws/quickstart.test.ts's afterAll removed it, dying on ENOENT (observed 501/502, immediate rerun 502/502)."
