# 2026-08-09 2026-08-09 The race fix is SKIP, not tolerate-ENOENT. .work is generated output and was never in that sweep's remit - test/laws/roster-count and test/laws/dependency-rule already skip it, and this walker was the odd one out. Tolerating ENOENT would have papered over a genuinely missing tree elsewhere. Verified with 5 consecutive full runs: 507/507 each.
# 2026-08-09 2026-08-09 SECOND ROUND: the .work skip is now OBSERVABLE. Previously, with an empty .work tree, deleting the skip entry stayed green unless the quickstart cleanup happened to land inside the readdirSync window - the assertion depended on ambient scheduling to expose its own regression. A controlled emitted pair is created under .work and removed in finally; deleting the skip now fails deterministically (1 failed / 58 passed). Also removed an unconditional .catch(() => undefined) from the repair test, which converted every unrelated rejection into success.

[[items]]
id = "SDK-28"
phase = "leverage"
title = "resolveAction WAS NOT TOTAL — second-round blocker. A throwing verb body propagated out of the SINGLE production site, through Boundary.submit, into the loop's onStepFinish, where the runtime's callback notification swallowed it - so the turn resolved with the record NEVER APPENDED. No ok, no refusal, no Unhandled: the action was simply absent from the timeline, the one outcome this architecture does not permit. The file's OWN header already promised 'the spine never throws at a seam'; it was false. Measured at the seam: 'resolveAction THREW: Error: verb body exploded'."
files = []
status = "done"
verify = "a throwing verb body yields seal(unhandled(tool, 'tool body failed')); mutation-checked - removing the try/catch turns the case red"
# 2026-08-09 2026-08-09 A throwing body is a DEFECT, and a defect is still a decision someone may need to ask about - so it commits as Unhandled and travels the same single path as everything else rather than being special-cased into silence. A second case pins that the catch does NOT swallow success into a blanket Unhandled.

[[items]]
id = "SDK-29"
phase = "leverage"
title = "PROVIDER-EXECUTED CALLS WERE RECORDED AS LOCAL REFUSALS — second-round blocker. StepResult.toolCalls also carries calls the PROVIDER executed, whose local execute is deliberately skipped. admittedCalls ignored the providerExecuted ownership bit, so a provider-owned call reached the local registry and committed Unhandled('no registered verb'). Measured verbatim before the fix: {outcome:unhandled, tool:providerSearch, note:'no registered verb'}. That is subtler than dropping it - the timeline CLAIMS the local system saw and refused something that was never its business."
files = []
status = "done"
verify = "a provider-executed call leaves the bus unchanged through a real turn; mutation-checked"
