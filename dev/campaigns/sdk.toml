# 2026-08-08 2026-08-08 LANDED, and the VERSION correction is the story. The audit recommended needsApproval from type inspection; a later pass read the published docs ('use needsApproval only with WorkflowAgent; use toolApproval') and retracted it. That retraction applied v7 DOCS to a v6 TREE. Measured at 6.0.208: toolApproval does not exist as a setting anywhere (only experimental_toolApprovalSecret), and needsApproval on Tool does. The original recommendation was right for this codebase all along - three passes to get one API right, all three recorded.
# 2026-08-08 2026-08-08 VerbSpec gains needsApproval?: boolean | ((input) => boolean), declared by the BLOCK and defaulting to absent, so every shipped verb behaves byte-identically. It is ADDITIVE TO THE GATE, never a replacement: the request/confirm rule stays pre-fold at the boundary with a COMMITTED refusal, because the runtime's approval flow carries no principal identity and cannot express 'a policy tier may confirm, this run may not'. A test asserts the self-confirm refusal is STILL committed, so the seam can never be read as softening the law. 3/3 green, suite 502/502 across 46 files.
# 2026-08-09 2026-08-09 WITHDRAWN UNDER REVIEW — BLOCKER, and the reviewer was right. Reproduced before touching anything: one approval-gated setPriority call moved recordsBefore=0 to recordsAfter=1 and committed outcome=ok while the verb body's own counter stayed at 0. The mechanism is SDK-5 biting: the runtime withheld the call, but resolveAction re-runs the PURE body at the boundary and C7 cannot see that the runtime declined, so the timeline invented a truth. My 'additive, never a replacement' claim was false the moment any block actually declared it.
# 2026-08-09 2026-08-09 THE REASONING ERROR, named so it does not recur: I justified needsApproval with the same 'make it expressible' argument as toModelOutput (SDK-1) and repairToolCall (SDK-14). It does not transfer. Those two are PURE PASSTHROUGHS; approval is a STATE MACHINE - request, decide, resume - and this port has no resume path. run() accepts no prior messages and TurnOutcome discards the approval request, so there was nothing to resume with. A pause primitive without a resume is not caution, it is a silent action-dropper. needsApproval is removed from VerbSpec entirely; the boundary gate is the only approval this port has, which is the one the book specifies.
# 2026-08-09 2026-08-09 KEPT AS DEFENCE-IN-DEPTH: admittedCalls() in spine/agent/loop filters any call the runtime withheld out of the boundary submit. It filters on the tool-approval-request CONTENT PART, not on toolResults as suggested - correlating against toolResults would also drop calls whose execute THREW, and those must still reach the boundary because their recorded truth comes from the pure re-run. That would have traded a silent commit for a silent omission. Three unit cases pin withheld-dropped, errored-kept, and normal-path-unaffected.
# 2026-08-09 2026-08-09 SECOND ROUND: the admission rule and the callback adapter MOVED to spine/boundary/action. C14 refused them in the loop for the fourth time this session - the providerExecuted filter is a logical chain, and deciding which calls a step may commit IS a decision. action.ts already owns FinishedStep, StepChannel and the one name-to-ToolResult map, so the admission rule now sits beside the shape it admits into. Nothing moved names the runtime.
# 2026-08-09 2026-08-09 MY FIRST WIRING FIX WAS INCOMPLETE, and the mutation harness caught it rather than review. Testing submitFinishedStep directly proves the ADAPTER filters; it does not prove onStepFinish CALLS it. Measured: with only that case, reverting the seam to a direct toolCalls.map left the file 10/10 green while the bypass was live. Added an end-to-end turn with a provider-executed call asserting the bus is unchanged - the revert is now 1 failed / 10 passed.

