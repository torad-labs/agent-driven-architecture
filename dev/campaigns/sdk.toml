# 2026-08-08 2026-08-07 PARTIAL RETRACTION OF A RETRACTION. needsApproval is wrong for ToolLoopAgent (use toolApproval) but CORRECT for WorkflowAgent, where approvals suspend and resume durable execution. So SDK-6 and SDK-15 are coupled: if SDK-15 adopts WorkflowAgent, the approval answer is needsApproval after all.
# 2026-08-08 2026-08-08 RECOMMENDATION: option A - tools declare toolApproval that DELEGATES to the boundary gate, which stays the sole arbiter. Not implemented, and deliberately so: the SDK approval flow carries no principal identity, so it cannot express 'a policy tier may confirm, this run may not' where both are truthfully Agent - and the different-principal rule is a book law. Adopting the SDK flow as the MECHANISM would lose that plus the committed refusal and the pre-fold ordering. Delegation is safe and idiomatic; replacement is not. Also coupled to SDK-15: if WorkflowAgent is ever adopted, needsApproval becomes correct and this answer changes.
