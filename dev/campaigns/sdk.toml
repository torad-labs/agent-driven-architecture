title = "CENSUS OF RECORD, superseding the header. The header's 'THE MEASUREMENT THAT OPENED IT' block says '216 TypeScript files; exactly ONE imports the SDK'. That was WRONG WHEN WRITTEN and is more wrong now. Measured 2026-08-08 against the landed tree: 226 TS files, 12 import the SDK. Of those, TWO are production (src/spine/agent/loop.ts names the runtime surface 'ai'; src/app/demo.ts names 'ai' for a LanguageModel type and 'ai/test' for the mock) and ten are tests. Read the header's line as superseded by this item."
files = []
status = "done"
verify = "grep -rln --include=*.ts -E 'from \"(ai|ai/[a-z]+)\"' src/ test/ | wc -l  == 12, of which 2 under src/"
# 2026-08-08 2026-08-08 WHY THIS IS AN ITEM AND NOT A HEADER EDIT, so nobody reads it as a dodge. amend-header is grant-gated because the header is injected into every future session as binding law, and /grant fires on UserPromptSubmit - which an assistant cannot emit. That is the no-self-grants law working as designed, not an obstacle to route around. The ledger's OWN header states the remedy: 'a claim that proves wrong gets a dated honesty-reconcile note, never a silent edit'. This item IS that mechanism. An operator who wants the header line itself rewritten can /grant and amend it; nothing depends on that happening.
# 2026-08-08 2026-08-08 HOW THE ORIGINAL ERROR HAPPENED, so the class is closed and not just the instance: I read the vercel-ai-audit skill's '=== SDK IMPORTS ===' section as a complete census. Its measure.sh greps for 'from "ai"' and '@ai-sdk', neither of which matches 'from "ai/test"'. The tool was not wrong; treating one tool's scope as exhaustive was. The verify line on this item is my own grep, which covers the ai/<subpath> form.
# 2026-08-08 2026-08-08 THE ARCHITECTURAL CLAIM THE BAD NUMBER WAS SUPPORTING IS UNCHANGED AND STILL TRUE: exactly ONE spine module names the runtime surface, and the composition root binds a model - which is what the book prescribes (8.2/8.5, G7). The confinement was never the defect. What was under-used inside it was, and that is what the other 22 items fixed.

[[items]]
id = "SDK-24"
phase = "env"
title = "CI CANNOT RUN — ACCOUNT/ORG LEVEL, NOT THIS BRANCH. PR #15 is open and mergeable, but every job across TWO independent workflows fails in ~3s with steps=0 and runner_name empty, and the log archive is a 22-byte empty zip: no runner is ever assigned. This is what blocks every matrix row from advancing past ready to verified, because the environment-of-record proof cannot be produced."
files = [".github/workflows/ci.yml"]
status = "done"
verify = "gh run rerun <a previously-green ci run>; a runner is assigned and steps execute"
# 2026-08-08 2026-08-08 EVIDENCE THAT IT IS NOT THE BRANCH, gathered before saying so. (1) actionlint passes on the modified ci.yml, exit 0. (2) CodeQL's three Analyze jobs fail IDENTICALLY (steps=0) and are GitHub default setup - a workflow this branch never touched. (3) THE CONTROL: run 31166601945, a ci.yml run that SUCCEEDED on 2026-08-07 against the UNMODIFIED workflow, re-run today and now fails the same way - 0 steps, no runner. (4) Re-running PR #15's own jobs reproduces deterministically, so it is not transient. A previously-green run of unchanged code failing today is the definition of environmental.
# 2026-08-08 2026-08-08 MY OWN PROCESS FAILURE, recorded because it is the reusable lesson: actionlint was installed at ~/.local/bin/actionlint the whole session and I did not run it until AFTER pushing a workflow edit. The vendored ci-hygiene gate checks job hygiene (timeouts, concurrency) but does not lint syntax, and I treated its green as sufficient. Next workflow edit runs actionlint before commit, not after CI goes red.
# 2026-08-08 2026-08-08 MOST LIKELY CAUSE, stated as a hypothesis and not a finding: Actions minutes or a spending limit for the torad-labs org, since Actions are enabled and permissions are 'all'. The billing endpoint moved (HTTP 410) so I could not confirm it from the CLI. OPERATOR CHECK: github.com/organizations/torad-labs/settings/billing. Nothing in this repository can fix it.
# 2026-08-08 2026-08-08 HONESTY-RECONCILE — THE CAUSE IS NOW MEASURED, AND MY HYPOTHESIS WAS WRONG. I wrote 'most likely Actions minutes or a spending limit'. It is neither. GitHub's own check-run annotation says verbatim: 'The job was not started because your account is locked due to a billing issue.' Retrieved from /repos/{o}/{r}/check-runs/{id}/annotations - the endpoint I should have queried before hypothesising, since it is where GitHub puts the reason when a job never starts.
# 2026-08-08 2026-08-08 THE ACTUAL NUMBERS, from /organizations/torad-labs/settings/billing/usage. ACTIONS COST 0.00 NET (965.61 gross, fully discounted) because this repository is PUBLIC and public-repo Actions are free - so the minutes theory was not merely unverified, it was contradicted by the data. The lock is an unpaid balance of 27.65 USD: GHAS 4.43 (2026-04) + 19.00 (2026-05) + 3.80 (2026-06) = 27.23, plus git_lfs 0.42 (2026-08, repo training-dojo). torad-labs is an Organization on the FREE plan with 32 private repos, which is what GHAS accrued against. A locked account blocks ALL Actions org-wide, including public repos where the compute is free - which is exactly why the unmodified control run and CodeQL default setup fail identically.
# 2026-08-08 2026-08-08 RESOLUTION IS OPERATOR-ONLY AND COSTS 27.65 USD at github.com/organizations/torad-labs/settings/billing. Nothing in any repository can affect it. Once paid, re-run PR #15's checks; the ten ready rows can then take their target_proof and advance to verified.
# 2026-08-08 2026-08-08 RESOLVED. Operator paid; the lock cleared between 23:31 and 23:52 UTC (run at 23:31 failed 'account locked', re-run at 23:52 succeeded). CI is GREEN on this branch: run 31284161862 - TypeScript npm test PASS 1m3s, Kotlin ./gradlew check PASS 1m59s, both with real steps on GitHub-hosted runners. The environment-of-record proof now EXISTS and is recorded as target_proof on all ten ready rows.

