# 2026-08-08 2026-08-08 RETRACTED CAUSAL CLAIM, and the row is BLOCKED rather than done. This item asserted the double-execution 'is owed ONLY because the boundary hooks onStepFinish instead of the tool input lifecycle'. MEASURED, that is false. Three facts, each checked in the tree: (1) a StepRecord carries actions AND results as ARRAYS - one record holds every tool call from one model step, which is 14.6's 'the step is the unit' (boundary.ts:140); (2) onInputAvailable fires PER TOOL CALL, so hooking it would commit N records per model step and change the committed timeline's shape, its schema's meaning and 14.6 with it; (3) StepChannel.submit returns a StepIndex and nothing else, so execute cannot receive what resolveAction produced without a NEW boundary seam. The price is therefore owed to C7 (one production site) plus the model needing a payload from execute - not to the callback choice.
# 2026-08-08 2026-08-08 WHAT WOULD ACTUALLY CLOSE IT, so the block is a decision and not a shrug: either (a) change step granularity to one record per tool call - which relitigates 14.6, a locked decision, and is not mine to take; or (b) add a boundary seam that hands the produced SealedResult back to the tool, making execute a CONSUMER of the one production site rather than a second evaluator. (b) is the interesting one and is arguably strictly better than today - it would make C7 stronger, not weaker - but it is a new spine seam and therefore orchestrator/operator work by the same rule. Note the file's own comment is honest about the price and calls a twice-evaluated pure function free; that remains true.
# 2026-08-08 2026-08-08 status=done means INVESTIGATED AND ROUTED, not implemented. The matrix row TOOL-LIFECYCLE is blocked with evidence and a probe; that block is the result.

