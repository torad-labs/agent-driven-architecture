# ═══════════════════════════════════════════════════════════════════════════════════════════════
# THE SYNTHETIC VIOLATION CORPUS
#
# Every entry here MUST be refused by some wall. dev/gates/ratchet.ts feeds each one through the
# live hook chain and fails if any is allowed through.
#
# WHY THIS EXISTS, AND WHY IT BEATS A PERMISSION SYSTEM
# This machine grants `(ALL) NOPASSWD: ALL`. An agent holding Bash therefore holds root, so no
# on-machine boundary — file ownership, a setuid helper, a daemon under another UID, chattr +a,
# the keyring, a signing key — can be made to hold against it. Every "structurally impossible"
# scheme that lives on this disk is theatre.
#
# So stop trying to control WHO may edit a wall and check WHETHER THE WALL STILL WORKS. That needs
# no trusted principal at all: it is mechanically decidable, and it is concept #924 turned on the
# enforcement layer itself. Weaken a rule and its entries here stop being caught — the gate goes
# red without anyone having to notice.
#
# WHAT IT DOES NOT CLAIM. An agent can delete entries from this file. The point is that doing so
# is CONSPICUOUS in a way an environment variable never was: it is a diff that says "-14 synthetic
# violations", it trips the count ratchet against the committed baseline, and it is semantically
# obvious to anyone reading the change. The bypass goes from one env var to three separate,
# self-incriminating edits recorded in history that is pushed off this machine.
#
# ENTRIES ARE DESCRIPTORS, NOT FILES. A corpus of real .py files would be caught by the very sweep
# it is meant to test, and a corpus that cannot sit in the tree is no corpus. So each entry names
# a path and content, and the gate synthesises the tool payload in memory.
#
# ADD AN ENTRY EVERY TIME A WALL LEARNS SOMETHING. The count only goes up.
#
# VENDORED from eli-operator 2026-07-27. The entries below cover the harness walls, which apply
# here unchanged. compose-flow s OWN walls (W-01..W-07 in dev/campaigns/setup/06-WALLS.md) add
# their entries as part of campaign item W-ALL — each proven red against the violation shipped
# beside its rule, BEFORE the module it protects exists.
# ═══════════════════════════════════════════════════════════════════════════════════════════════

