[[laws]]
id = "G14"
name = "spine-swapped-only-by-contract"
layers = ["denying-check", "discipline"]
headline = "Discipline, with one denied precondition."
note = "The tier check keeps the spine liftable; whether a change swaps-by-contract or forks is a review judgment no snapshot rule reads."
guarantee = "A spine component — the bus, the fold, replay, the mailbox, or the gate — is replaced only by supplying a new adapter behind its published <a class=\"x\" href=\"#system-map-ports\">contract</a>, never forked, bypassed, or weakened. The swap seams are a closed, named set; the laws (<a class=\"x\" href=\"#enforced-constraints\">G1</a>–G13, <a class=\"x\" href=\"#enforced-constraints\">G15</a>–G16) hold across every spine, default or custom. A spine change that needs more than one adapter, or that weakens an invariant, has left the architecture (<a class=\"x\" href=\"#runtime-vs-you\">8.5</a>)."

