[[laws]]
id = "G4"
name = "domain-imports-nothing-foreign"
layers = ["denying-check"]
headline = "Denying check."
note = "§1.3's import table as an allow-list, and the rung above it is out of reach for a reason worth stating. A module declares what it may depend on, so an edge can refuse a foreign module — but where a package manager hoists one copy of every dependency to a single root, a bare third-party name resolves from inside any module that root reaches, declared there or not. One reference port draws that edge and the other cannot, so the allow-list is where this law is held."
guarantee = "The pure domain core imports no framework, transport, UI, or platform types. I/O lives only at the named edges."

