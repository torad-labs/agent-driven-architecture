# laws.toml — THE LAW REGISTRY. One source of truth for the sixteen
# portable invariants: their public id, their invariant name, the layer that
# actually holds each one, and the checks (with their fixture pairs) that do
# the holding. The book's §15.3 table is ASSERTED against this file by
# examples/typescript/test/laws/laws.test.ts, which also proves that no law
# ships without an enforcement layer and no denying check ships without a
# fixture pair that resolves on disk.
#
# Since §15's inversion each law's LAYER rides the law's own row — the fourth
# cell of that one table — so id, name, guarantee and layer are read together
# and cannot drift into two tables that disagree, in either keying.
#
# `layers` is a CLOSED vocabulary: configuration-time | denying-check |
# compiler-proof | behavioral | discipline | structural-untested. `headline`
# and `note` are the book cell, verbatim — the meta-check reconstructs the cell
# from them byte for byte.
#
# THE FLOOR RULE, for `configuration-time` and for every token that follows it.
# One `layers` field prints ONE cell, and that cell speaks for BOTH ports — so a
# token may appear here only where the rung holds on EVERY port the registry
# covers. A rung one port reaches earlier than the other is prose in the `note`;
# it is never a headline word and never a `layers` entry, because a cell that
# reports the stronger port has promised a wall the other port has not built.
# The floor is mechanical, not a taste call: a law claiming the token owes one
# `[[laws.edges]]` row PER PORT, checked in both directions by the shape rule.
#
# `[[laws.edges]]` — keys `port`, `path`, `token`, and nothing else. `token` is
# the DECLARATION whose deletion removes the refusal, and the checker resolves
# the path AND requires the token to still occur in it, so a wall that is
# deleted while its row survives is red rather than green. Without that, a
# layer claim with nothing behind it passed the entire gate — the one field in
# this registry that was prose wearing a machine field's clothes.
#
# THE EDGED SET IS DERIVED BY MEASUREMENT, recorded here so it does not reopen.
# A build edge is the declared, permitted-dependency relation between two
# modules, and what it refuses it refuses before either module compiles.
# Measured on both reference ports: a deep import of a sibling block's internals
# is a resolution refusal on BOTH, so the dependency and isolation laws carry
# the token. A foreign library named INSIDE a module the graph already permits
# is refused on one port and accepted on the other — so neither the purity law
# nor the foreign-import law qualifies, however structural either feels, and
# both stay on the denying-check rung with the asymmetry stated in their notes
# rather than dissolved into a headline.
#
# `pair = "in-checker"` is §15.2's listed shape difference: a check about
# VALUES carries its block/allow pair as two inputs to the same checker, not
# as two trees on disk. Only a home the lint does not own may declare it, and
# "lint-owned" is DERIVED from the eslint config source and the konsist rule
# list — never from a token in this file, which a forger would simply edit.
#
# THE SHAPE DIFFERENCE IS WHERE THE PAIR LIVES, NEVER WHETHER THERE IS ONE, and
# for one landing this file said otherwise: the in-checker branch required
# `violating` and `compliant` EMPTY and demanded nothing in their place, so a
# value check could claim the shape, ship no block-test at all, and pass the
# fixture assertion. So an in-checker row names `blockTest` and `allowTest`
# instead, each `<path>::<exact test title>`, and the checker RESOLVES both
# rather than reading them: the runner must be one that would open the file, the
# file must still declare a case under that title in LIVE code, that declaration
# must not be switched off, and the two halves must be two different cases. A
# renamed case is red; a deleted one is red even with the deleting author's
# comment left behind; a case turned off with `it.skip` or `@Ignore` is red,
# because a disabled check denies nothing; and one site named twice is red,
# because that is a row declaring one half while spelling two. The two field
# pairs are mutually exclusive and each shape is refused the other's, so no row
# can be read two ways — an in-checker row that also names a tree is reported,
# and so is an on-disk row that names a test site. Both shapes are also refused a
# pair that is one thing named twice, from the same checker, so neither branch
# is held to a bar the other is not.
#
# SCOPE, DECLARED: this registry holds G-LAWS and nothing else. The reference
# lint that enforces the public citation namespace (test/laws/citations.ts) is
# a citation check, not a G-law — the ratified decisions record refuses a
# seventeenth law, §16.4's bar being unmet — so it is deliberately absent from
# the rows below rather than silently missing. This file is itself scanned by
# that lint: the registry obeys the namespace it defines.

vocabulary = ["configuration-time", "denying-check", "compiler-proof", "behavioral", "discipline", "structural-untested"]

[[laws]]
id = "G1"
name = "actor-stamped-at-boundary"
layers = ["denying-check", "behavioral"]
headline = "Denying checks + behavior."
note = "One denying check holds the declaration rule (no Actor/Authority/Signature upstream); a second holds one production site for signed transport; the stamp's TYPE additionally denies construction outside that site — no value-copy member where the language ships one, a nominal brand where it does not. Neither type shape closes the forge on its own — a generic helper launders any brand — so the stamp is also frozen when minted, and a Command carrying a stamp other than the one its own step minted is refused at the boundary by identity. WHICH <code>Actor</code> rides that stamp is no longer a claim the payload makes: a finished step carries none, and the boundary publishes one submission channel per value, so a caller stamps what its channel stamps. That the boundary <em>stamps correctly</em> is behavioral (the boundary tests); that a caller cannot ask for a different value is the shape of the step type, and the gate was never the layer that held it — it compares Authorities and never reads <code>sig.by</code>."
guarantee = "Every <code>Command</code> carries its <code>Actor</code> <em>and</em> the <code>Authority</code> it was admitted under, paired on one <code>Signature</code>. Both are stamped only at the boundary and neither can be forged upstream — an <code>Actor</code> is <strong>unrepresentable</strong> before that point, not merely unstamped: no tool result and no field of the read-only context may declare one (<a class=\"x\" href=\"#signed-command-bus\">5.3</a>). The Actor answers <em>who acted</em>; the Authority answers <em>under whose permission</em>; the irreversible gate keys on the Authority, never on the Actor."

