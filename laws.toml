[[laws]]
id = "G12"
name = "exhaustive-discriminated-modeling"
layers = ["denying-check", "compiler-proof"]
headline = "Denying check + compiler proof."
note = "No <code>else</code> over a sealed subject, type-aware, plus TWO checked-in compiler-proof fixture pairs the real compiler must break on at a named number of sites and nowhere else: a fifth state variant at exactly three sites, all inside the owning block, and a novel effect kind at exactly one PRODUCTION site, the owning block's own effect performer, plus each port's single out-of-folder gate ledger, which both READMEs name and measure."
guarantee = "A value that is &ldquo;one of a fixed set&rdquo; — <code>State</code>, the run status, a command outcome, a presentational variant on the view-model — is modeled as a sealed discriminated union whose variants each carry their own payload, never as loose booleans (flag soup) or a bare string. Consumers handle it with a closed match and <em>no catch-all</em>, so the type system proves every case is handled and adding a variant fails to compile at every site that must handle it — the fold arm, the <a class=\"x\" href=\"#stateless-reducer-agent\">view projection</a>, the boundary's command map — until each is updated. Illegal combinations (a <code>Failed</code> with no reason, a <code>Loading</code>-and-<code>Done</code>) are unrepresentable rather than merely avoided. The missing case surfaces at build time, never at runtime (<a class=\"x\" href=\"#stateless-reducer-agent\">6.10</a>)."

