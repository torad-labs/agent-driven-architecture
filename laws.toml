[[laws]]
id = "G5"
name = "surface-decides-nothing"
layers = ["discipline"]
headline = "Discipline."
note = "No check denies a deciding surface today. The reference surfaces are projections by construction, but nothing would catch a regression — this is the sharpest open edge in the map."
guarantee = "A surface handler maps one interaction to exactly one action and contains no decision — no <em>domain/policy</em> branch on business state to decide what is true, and no <em>presentational</em> decision (whether to show an empty state, whether a control is enabled) computed in the view or the controller. The view renders <em>by</em> pre-computed values: it applies flags the <a class=\"x\" href=\"#stateless-reducer-agent\">view projection</a> already decided (<code>showEmptyState</code>, <code>isEnabled</code>) and reads which variant of a state to draw — it never computes the flag behind the branch. Rendering by a pre-decided value stays in the view; computing the decision belongs to the projection (<a class=\"x\" href=\"#stateless-reducer-agent\">6.9</a>)."

[[laws]]
id = "G6"
name = "irreversible-action-gated"
layers = ["denying-check", "behavioral"]
headline = "Behavioral + three denying edges."
note = "The gate's authority-vs-requester comparison and its committed verdict are exercised by tests, and three denying checks fence the seam: one forbids minting the gate's <code>Refused</code> verdict anywhere else, one forbids opening the fold's attributed output outside the admission rule, and one forbids constructing an <code>Irreversible</code>-class effect anywhere but its own pinned site. So an effect reaches the perform seam only through a licence check keyed on the result it came from. What remains unproven by denial is the boundary's own code path: nothing statically proves the ordered steps stay in order."
guarantee = "An agent may dispatch only a non-destructive <code>Request</code> for an irreversible action; the destructive command needs explicit confirmation. The check runs <strong>at the boundary, before the fold commits</strong>, and compares the <em>confirming authority</em> against the <em>requesting authority recorded in State</em> — not against a <code>Human</code> literal (<a class=\"x\" href=\"#replay-and-recovery\">14.3</a>). A refusal is committed as an explicit <code>Refused</code> result, so it re-folds like any other decision and the authorization seam is never called again on replay."

