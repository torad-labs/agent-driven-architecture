[[laws]]
id = "G10"
name = "dependencies-point-inward"
layers = ["configuration-time", "denying-check"]
headline = "Configuration-time build edges + denying checks."
note = "The module-crossing half is a build edge: a block declares the trunk as the only thing it may depend on, an adapter leaf declares its own block, and the trunk declares nothing at all — so a sibling block's internals are not a name those modules can resolve — refused on both reference ports by the module graph rather than by a rule that must run, at configuration in the Gradle port and as a resolution error in the TypeScript one. An edge permits a WHOLE module, so it can neither deny a direction inside one module nor narrow which part of a permitted module a consumer may reach: a surface naming a reducer, and a block reaching past the trunk's pure tier into its impure one, both stay with the per-folder and per-tier denying checks."

