# laws.toml — THE LAW REGISTRY. One source of truth for the sixteen
# portable invariants: their public id, their invariant name, the layer that
# actually holds each one, and the checks (with their fixture pairs) that do
# the holding. The book's §15.3 table is ASSERTED against this file by
# examples/typescript/test/laws/laws.test.ts, which also proves that no law
# ships without an enforcement layer and no denying check ships without a
# fixture pair that resolves on disk.
#
# Since §15's inversion each law's LAYER rides the law's own row — the fourth
# cell of that one table — so id, name, guarantee and layer are read together
# and cannot drift into two tables that disagree, in either keying.
#
# `layers` is a CLOSED vocabulary: denying-check | compiler-proof | behavioral
# | discipline | structural-untested. `headline` and `note` are the book cell,
# verbatim — the meta-check reconstructs the cell from them byte for byte.
#
# `pair = "in-checker"` is §15.2's listed shape difference: a check about
# VALUES carries its block/allow pair as two inputs to the same checker, not
# as two trees on disk. Only a home the lint does not own may declare it, and
# "lint-owned" is DERIVED from the eslint config source and the konsist rule
# list — never from a token in this file, which a forger would simply edit.
#
# SCOPE, DECLARED: this registry holds G-LAWS and nothing else. The reference
# lint that enforces the public citation namespace (test/laws/citations.ts) is
# a citation check, not a G-law — the ratified decisions record refuses a
# seventeenth law, §16.4's bar being unmet — so it is deliberately absent from
# the rows below rather than silently missing. This file is itself scanned by
# that lint: the registry obeys the namespace it defines.

vocabulary = ["denying-check", "compiler-proof", "behavioral", "discipline", "structural-untested"]

[[laws]]
id = "G1"
name = "actor-stamped-at-boundary"
layers = ["denying-check", "behavioral"]
headline = "Denying checks + behavior."
note = "One denying check holds the declaration rule (no Actor/Authority/Signature upstream); a second holds one production site for signed transport; the Kotlin stamp additionally ships without a <code>copy()</code> constructor, and the TypeScript one is a nominal class whose constructor only the boundary folder may name. Neither type shape closes the forge on its own — a generic helper launders any brand — so the TypeScript stamp is also frozen when minted, and a Command carrying a stamp other than the one its own step minted is refused at the boundary by identity. That the boundary <em>stamps correctly</em> is behavioral (the boundary tests)."

