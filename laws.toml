[[laws]]
id = "G10"
name = "dependencies-point-inward"
layers = ["configuration-time", "denying-check"]
headline = "Configuration-time build edges + denying checks."
note = "The module-crossing half is a build edge: a block declares the trunk as the only thing it may depend on, an adapter leaf declares its own block, and the trunk declares nothing at all — so a sibling block's internals are not a name those modules can resolve — refused by the module graph itself rather than by a rule that must run. An edge permits a WHOLE module, so it can neither deny a direction inside one module nor narrow which part of a permitted module a consumer may reach: a surface naming a reducer, and a block reaching past the trunk's pure tier into its impure one, both stay with the per-folder and per-tier denying checks."
guarantee = "<a class=\"x\" href=\"#the-dependency-rule\">The dependency rule</a>, in its canonical wording: an import may point inward toward the core, or it is the composition root; it may never point outward from the core, sideways between adapters, or from a passive node — a surface or a tool — into anything but domain types. Concretely: a surface imports <code>State</code> and <code>Command</code> types only — never the <code>fold</code>, a policy, or any adapter — adapters never import one another (they meet at core-declared ports, wired at the root), and the core never names a surface or transport. Each forbidden edge — surface&rarr;infra, surface&rarr;reducer, domain&rarr;surface, adapter&rarr;adapter, tool&rarr;framework — is a structural break in unidirectional flow, port substitution, or replay, not a style note."

