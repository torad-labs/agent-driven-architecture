[[laws]]
id = "G16"
name = "artifact-is-a-folded-slice"
layers = ["behavioral"]
headline = "Behavioral."
note = "The artifact re-derives in the recovery tests and diffs by value in the block tests. No rule denies an effect-assembled artifact statically."
guarantee = "The generated artifact is a slice of the one folded <code>State</code>, one line per fold arm. It is <strong>never assembled by performed effects</strong>, so it re-derives from the recorded timeline, diffs by value, and survives a crash for free. Delivery is a <em>single</em> irreversible effect emitted at seal time and gated by <a class=\"x\" href=\"#enforced-constraints\">G6</a> — never one effect per line performed as the session goes, and never stubbed into invisibility on replay (<a class=\"x\" href=\"#the-inversion\">2.2</a>, <a class=\"x\" href=\"#concurrency-barge-in\">12.2</a>)."
