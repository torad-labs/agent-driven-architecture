[[laws]]
id = "G11"
name = "component-isolation"
layers = ["configuration-time", "denying-check"]
headline = "Configuration-time build edges + denying checks."
note = "A block's permitted dependencies name the trunk and never a sibling, so a sibling's internals are unresolvable rather than merely forbidden — the edge, on both reference ports. Two cross-block routes survive it and the checks still hold them, both the interim state rather than the end state: a block's own <em>published</em> entry, which a package graph cannot show the root while hiding from a sibling, and — where a language requires every variant of a sealed set to live in one module — the block's transport hosted in the trunk under a <em>name-prefix</em> convention standing in for the module wall. View-state stays visible only to its own projection."
guarantee = "A feature may be authored as a self-contained block whose public face is one or more tools and whose internals — a namespaced <code>State</code> slice, fold arms, a view-model, a port interface, and a private adapter behind that port — are owned by the block and invisible to siblings. Isolation grants no new power over the spine: the block's tools stay pure <code>(input, ctx) -&gt; payload</code> and perform no I/O (its repository is an injected read-only capability for reads, an effect descriptor performed at the one boundary for writes); every external read it makes is captured as an ordered fixture on the one timeline and replayed, never recomputed; it contributes <em>cases</em> to the one sealed <code>Command</code> and arms to the one fold but owns no bus, log, reducer, boundary, or composition-root wiring; its state is a slice of the one immutable <code>State</code>, never a separate root; it holds only ephemeral, non-replay-relevant view-state and never business truth; it emits an unsigned intent and never stamps the <code>Actor</code>; and blocks couple only through shared domain types, the one bus, and the one folded <code>State</code> — never by importing a sibling's internals. The block owns the leaves; the spine owns the trunk, and the trunk is never per-block. <strong>The failure this catches that <a class=\"x\" href=\"#enforced-constraints\">G10</a> cannot:</strong> a sibling coupling to this block's <code>State</code> slice <em>by its internal shape</em> rather than through the bus and the block's published slice contract &mdash; import-legal, since the slice sits on the one shared <code>State</code> both are entitled to read, yet exactly the cross-block coupling isolation forbids. G10 governs import <em>direction</em>; G11 governs what a block may <em>expose</em> and what a sibling may <em>lean on</em> &mdash; a failure no forbidden import would reveal."

