name = "single-state-single-sink"
layers = ["structural-untested"]
headline = "Structural by type, un-denied."
note = "The Controller exposes one value and one sink because its type declares nothing else; no rule would catch a second public member growing beside it."
guarantee = "A surface controller exposes exactly one immutable value — the <code>ViewModel</code> projected from the one domain <code>State</code> (<a class=\"x\" href=\"#stateless-reducer-agent\">6.9</a>) — and one action sink, nothing else public. The projection is derived and read-only, so it is no second source of truth."

[[laws]]
id = "G9"
name = "identity-and-clock-injected-at-boundary"
layers = ["denying-check", "behavioral"]
headline = "Denying checks + behavior."
note = "Two checks deny — ambient clock, random and id including resolved calls, and effect keys nameable only by the boundary and replay; the capture-external-reads half is behavioral (relay and replay golden traces). Ambient reads are library calls in scope everywhere, so no visibility rule removes them."
guarantee = "No model or tool reads the wall clock, draws a random number, or mints an id. The boundary passes <code>now</code> into the fold and assigns ids deterministically from the committed sequence. The same discipline extends to any tool whose <em>result</em> depends on an external source: it must be recorded as an ordered fixture and fed back on re-fold, never recomputed. And no fold may mint an effect's idempotency key: <code>Effect</code> carries no identity, the boundary alone derives <code>EffectKey(committed step index, effect index within the step)</code>, and <code>perform</code> accepts only a <code>KeyedEffect</code> (<a class=\"x\" href=\"#replay-and-recovery\">14.6</a>). This is the rule replay depends on most."

