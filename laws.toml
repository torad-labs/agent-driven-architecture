[[laws]]
id = "G13"
name = "contract-first-stable-interface"
layers = ["denying-check", "discipline"]
headline = "Denying check for the snapshot half; discipline for the rest."
note = "A port file with a body fails. Both remaining halves are discipline, and the word is used here exactly as this column defines it — no machine holds them. The contract-<em>first</em> ordering half is temporal, as G13's own text states. The fresh-author trial is human: a person is handed one contract and asked to implement from it, and nothing automates that. What the release ritual adds is not a wall around either but a receipt for the second — the trial's shortlist is counted per release and its finding recorded — which is why the layer is declared rather than left to this note."
guarantee = "Every seam a module presents outward — a core port, a block's port-and-adapter, a block's tool registration plus the slice shape siblings read off <code>State</code> — is a published, frozen contract: a stable public surface (inputs, outputs, shape invariants, error and tolerance semantics, written in a per-module coordination note) that downstream depends on instead of the implementation behind it. The contract lands first, as a skeleton, <em>before</em> its body; internals may then change freely without breaking any consumer; modules couple only through declared contracts, never hidden shared state, and each is tested against its own contract in isolation, without the rest of the workspace assembled. The governing check: an unfamiliar author can implement the module from its contract alone, never reading a sibling's source. This is narrower and more procedural than <code>dependencies-point-inward</code> (G10, import direction) or <code>component-isolation</code> (G11, ownership) — it adds the written, versioned contract, the skeleton-before-implementation order, and per-module test isolation those do not state. The outward interface is narrow and frozen; the module behind it may be deep, and the spine it contributes additive cases into stays open for extension (<a class=\"x\" href=\"#system-map-ports\">7.9</a>). <strong>The failure this catches that <a class=\"x\" href=\"#enforced-constraints\">G10</a> and <a class=\"x\" href=\"#enforced-constraints\">G11</a> do not:</strong> a block that <em>ships its body before its port is frozen</em>, leaving a sibling nothing stable to depend on, so it couples to internals that then change underneath it &mdash; import direction (G10) and ownership (G11) both hold at that instant; only contract-<em>first</em> ordering prevents it. What the gate mechanically keys on is a <em>snapshot</em>: a published contract <em>exists</em>, the implementation <em>conforms</em> to it, and the module <em>compiles and tests in isolation</em> against that contract alone &mdash; so a block that <em>imports</em> a sibling's internals fails its own isolation build, whatever the authoring order &mdash; while shape-coupling through the shared <code>State</code> is caught not here but by <a class=\"x\" href=\"#enforced-constraints\">G11</a>, since that coupling rides a type both blocks may legitimately import. Contract-<em>first</em> ordering is itself a temporal property a tree-snapshot gate cannot read &mdash; it is the authoring discipline those structural checks make cheap to follow, enforceable directly only by a history-aware CI check and never claimed of the snapshot gate, with the fresh-author criterion as the heuristic behind it."

