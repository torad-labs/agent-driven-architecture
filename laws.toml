[[laws]]
id = "G15"
name = "context-is-a-pure-projection"
layers = ["behavioral"]
headline = "Behavioral."
note = "The committed digest is re-derived and compared on replay (the golden trace); the purity check keeps the projections pure. No rule denies a mutable accumulator shape statically."
guarantee = "The reasoner's input <code>Context</code> is a pure projection of the committed <code>State</code> plus the input staged for this turn — <code>projectContext(state, staged, bounds) -&gt; Context</code> — assembled at the one root from each block's own <code>contextLines</code>. It is <strong>never a mutable accumulator</strong>: it is recomputed every step, never appended to. Its size is bounded by declaration independent of session length, and the rendered digest plus the active prompt version are captured on the timeline as an ordered fixture, then re-derived and compared on replay (<a class=\"x\" href=\"#stateless-reducer-agent\">6.11</a>, <a class=\"x\" href=\"#replay-and-recovery\">14.7</a>)."

