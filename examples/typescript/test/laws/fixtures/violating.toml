# BLOCK-TEST for the registry check. Twenty-seven deliberate violations, one per law:
#   G1  a law with NO enforcement layer             (the first bar)
#   G2  a denying-check law whose pointer is GONE   (the un-resolved-string trap)
#   G3  a denying-check law that names no check     (the second bar)
#   G4  a LINT-OWNED check claiming an in-checker pair (the value-check escape)
#   G5  a pointer that resolves to an EMPTY tree    (a fixture dir with nothing)
#   G6  a law whose NOTE credits a check while the law names none
#   G7  a law enforced on ONE PORT only
#   G8  a law that dropped one PORT of a check id another law also holds
#   G10 layers CLAIM the configuration-time rung, the headline does not
#   G11 the headline CLAIMS a build edge, the layers do not
#   G12 the rung claimed with edge evidence on ONE PORT ONLY
#   G13 the rung claimed with NO edge evidence at all
#   G14 a build edge declared while the layers omit the rung it proves
#   G15 an edge whose file no longer DECLARES the token the row names
#   G16 an edge pointer that resolves to nothing, and an edge naming a port the
#       registry does not cover
#   G17 a value check whose in-checker pair NAMES NO BLOCK-TEST, and one naming a
#       case the file does not declare
#   G18 a value-check site pointing at a file that is not there, and one that is
#       not <path>::<title> at all
#   G19 an on-disk row wearing a test site — the row nobody can say they read
#   G20 an in-checker row wearing a fixture tree — the same defect, mirrored
#   G21 a case that survives ONLY in the comment its deleting author left behind
#   G22 a pair that is ONE input named twice — in-checker and on-disk, one each
#   G23 a case switched off with `it.skip`, and one with `@Ignore`
#   G24 a case switched off with `xit`, and one with `@Disabled`
#   G25 a case that is only `it.todo`, and a backticked fun carrying no `@Test`
#   G26 a case inside a SUITE that is switched off, and a title that occurs only
#       as an argument in live code — quoted, but not a declaration
#   G27 a block-test the runner would never execute: a path outside vitest's
#       include shape, and one under its exclude list
#   G28 a `pair` nobody can read — a PROTOTYPE key and an ordinary typo
# G9 is the control: it holds the same duplicated id on BOTH ports and must not
# be reported. A registry check that accepts this file is not a check.
#
# G17-G28 are the block half of "the shape difference is where the pair lives,
# never whether there is one". Before them the in-checker branch asked for two
# EMPTY fields and nothing else, so a value check could ship no block-test at all
# and this file's own G4 row was the only thing the branch could ever report. The
# two SHAPE-CONFUSION rows, G19 and G20, are the mirror pair: each field set is
# refused the other's, in both directions, so neither can be the untested one.
# G21 and G23-G26 are the block half of RESOLUTION rather than search: a quoted
# substring is satisfied by a deleted case, a disabled case and a title in any
# role at all, and each of those is spelled here separately because a matcher
# that catches `it.skip` need not catch `xit`. G22 is the block half of "a pair
# is two things", on BOTH shapes from one checker.
#
# G10-G14 are the block half of THE FLOOR RULE, and they are five laws rather
# than one because the rule is a JOINT with four ways to come apart: the machine
# field outranking the printed sentence, the sentence outranking the field, the
# rung claimed where only the stronger port earns it, and the rung claimed on no
# evidence at all. G15 and G16 are the block half of "pointers are resolved,
# never trusted" for the same field — a deleted wall whose row survived it, and
# a row pointing at nothing.

vocabulary = ["configuration-time", "denying-check", "compiler-proof", "behavioral", "discipline", "structural-untested"]

