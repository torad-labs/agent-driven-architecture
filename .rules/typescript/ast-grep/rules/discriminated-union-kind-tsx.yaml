# TSX TWIN — ast-grep parses .tsx with a SEPARATE grammar, so a rule declaring
# `language: typescript` is silent on every .tsx file no matter what its `files:`
# globs say. 20 rules in this pack targeted **/*.tsx under the typescript grammar
# and could never fire; the UI surface was entirely unenforced. This twin carries
# the same matcher under `language: tsx`.
# TENET: Discriminated unions should use 'kind' field.
# Rationale: TypeScript's discriminated unions work best with a literal field.
# Standardize on 'kind' (not 'type', 'tag', 'variant') for consistency.
# Pattern: type Action = { kind: 'increment' } | { kind: 'decrement', amount: number }
id: discriminated-union-kind-tsx
language: tsx
severity: error
message: "Use 'kind' as the discriminator field for unions (not 'type', 'tag', 'variant')."
files:
  - "**/*.tsx"
ignores:
  - "**/*.test.tsx"
  - "**/test/**"
rule:
  kind: type_alias_declaration
  has:
    kind: union_type
    has:
      kind: object_type
      has:
        kind: property_signature
        has:
          kind: property_identifier
          any:
            - regex: "^type$"
            - regex: "^tag$"
            - regex: "^variant$"
