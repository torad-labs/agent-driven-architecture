# TENET: No mutable exports — exports should be const or readonly.
# Rationale: Mutable module-level state creates hidden coupling.
# Use const for exports, or encapsulate state in a class/closure.
id: no-mutable-export
language: typescript
severity: error
message: "Export const, not let. Mutable exports create hidden coupling."
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "**/*.test.ts"
  - "**/test/**"
rule:
  any:
    - pattern: export let $VAR = $VALUE
    - pattern: export let $VAR
