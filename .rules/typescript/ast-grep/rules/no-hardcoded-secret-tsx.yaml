# TSX TWIN — ast-grep parses .tsx with a SEPARATE grammar, so a rule declaring
# `language: typescript` is silent on every .tsx file no matter what its `files:`
# globs say. 20 rules in this pack targeted **/*.tsx under the typescript grammar
# and could never fire; the UI surface was entirely unenforced. This twin carries
# the same matcher under `language: tsx`.
# TENET: No committed secrets.
# Rationale: Credentials must come from environment, secret stores, or injected
# runtime bindings. Secret-looking literals in source become permanent exposure.
id: no-hardcoded-secret-tsx
language: tsx
severity: error
message: "Do not commit hardcoded secrets; use environment or secret storage."
files:
  - "**/*.tsx"
rule:
  kind: string_fragment
  regex: '(?i)(sk_live_[A-Za-z0-9_\-]{8,}|ghp_[A-Za-z0-9_]{8,}|xox[baprs]-[A-Za-z0-9\-]{8,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
