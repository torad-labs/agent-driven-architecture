# TENET: Exhaustive switch on discriminated unions.
# Rationale: Use never check in default case to catch missing variants at compile time.
# Pattern:
#   switch (action.kind) {
#     case 'increment': return ...;
#     case 'decrement': return ...;
#     default: const _exhaustive: never = action; throw new Error(`Unhandled: ${_exhaustive}`);
#   }
id: exhaustive-switch
language: typescript
severity: error
message: "Add exhaustive check in switch default: const _exhaustive: never = value;"
files:
  - "**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/test/**"
rule:
  kind: switch_statement
  all:
    - has:
        kind: switch_body
        has:
          kind: switch_default
    - not:
        has:
          # stopBy: end at every level. `has` looks at DIRECT children, and the guard
          # normally sits inside a block — `default: { const _never: never = r; ... }`
          # — so the nested form was invisible and 34 of 34 hits in examples/typescript
          # were switches that already carried the check.
          kind: switch_body
          stopBy: end
          has:
            kind: switch_default
            stopBy: end
            has:
              stopBy: end
              pattern: "const $_: never = $VAR"
