# TENET: No dynamic code execution.
# Rationale: eval/new Function and concatenated shell commands erase the type and
# shell boundaries. Use typed APIs, argument arrays, or explicit command builders.
id: no-dangerous-dynamic-exec
language: typescript
severity: error
message: "Avoid dynamic code execution; use typed APIs or argument arrays instead."
files:
  - "**/*.ts"
  - "**/*.tsx"
rule:
  any:
    - pattern: eval($$$ARGS)
    - pattern: new Function($$$ARGS)
    - pattern: exec($CMD + $REST)
    - pattern: execSync($CMD + $REST)
