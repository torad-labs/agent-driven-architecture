id: no-clock-or-random-in-domain
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  - "**/src/*Test/kotlin/**"
  - "**/src/test/kotlin/**"
  # grandfather entries are per-repo; installs append their own
message: "no-clock-or-random-in-domain: common domain code must not read the wall clock, draw randomness, or mint ids. Inject time and ids at the boundary."
rule:
  any:
    - pattern: System.currentTimeMillis()
    - pattern: System.nanoTime()
    - pattern: Instant.now()
    - pattern: java.util.UUID.randomUUID()
    - pattern: UUID.randomUUID()
    - pattern: Random.nextInt($$$)
    - pattern: Random.nextLong($$$)
    - pattern: Random.nextDouble($$$)
    - pattern: Date.now()
    - pattern: kotlin.js.Date.now()
