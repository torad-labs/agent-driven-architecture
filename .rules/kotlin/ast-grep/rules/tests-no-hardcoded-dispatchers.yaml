# TENET: No hardcoded Dispatchers in tests.
# Rationale: Literal Dispatchers.IO/Default/Main/Unconfined force real threads and real time.
# Use TestDispatcher (StandardTestDispatcher(testScheduler)) for virtual time + deterministic ordering.
id: tests-no-hardcoded-dispatchers
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  - "**/Dispatchers*.kt"
  - "**/*DispatcherProvider*.kt"
  # grandfather entries are per-repo; installs append their own
  # per-repo: src/test/fixtures/ is HARNESS DATA, not source — detekt/konsist read it
  # as text and Gradle never compiles it (no srcDir declares it). violating/ fixtures
  # exist in order to violate; scanning them is a category error.
  - "**/src/test/fixtures/**"
message: "Inject a TestDispatcher, not Dispatchers.IO/Default/Main. Hardcoded dispatchers use real threads."
rule:
  any:
    - pattern: Dispatchers.IO
    - pattern: Dispatchers.Default
    - pattern: Dispatchers.Main
    - pattern: Dispatchers.Unconfined
