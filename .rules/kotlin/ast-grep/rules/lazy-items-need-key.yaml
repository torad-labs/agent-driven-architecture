# TENET: LazyColumn/LazyRow items need key parameter.
# Rationale: Without key, Compose can't track item identity across recompositions.
# This causes animations to break and state to be lost.
# Always: items(list, key = { it.id }) { ... }
id: lazy-items-need-key
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  - "**/test/**"
  - "**/*Test/**"
  - "**/testFixtures/**"
  # grandfather entries are per-repo; installs append their own
message: "Provide key parameter to items() for stable identity: items(list, key = { it.id })"
rule:
  pattern: items($LIST) { $$$BODY }
  not:
    has:
      pattern: key = $KEY
