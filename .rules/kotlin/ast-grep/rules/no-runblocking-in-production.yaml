# TENET: No runBlocking in production code.
# Rationale: runBlocking blocks the calling thread and defeats structured concurrency.
# Use suspend functions or launch from a proper CoroutineScope.
id: no-runblocking-in-production
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  - "**/test/**"
  - "**/*Test/**"
  - "**/testFixtures/**"
  - "**/Main.kt"
  - "**/*Application.kt"
  # grandfather entries are per-repo; installs append their own
message: "Don't use runBlocking in production. Use suspend functions or proper CoroutineScope."
rule:
  any:
    - pattern: runBlocking { $$$BODY }
    - pattern: runBlocking($$$ARGS) { $$$BODY }
