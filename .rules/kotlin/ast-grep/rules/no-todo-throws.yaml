# TENET (G60, imported+adapted from torad-toolkit resources/configs/kotlin-rules/ast-grep):
# TODO() throws NotImplementedError at runtime — a placeholder that compiles clean and only
# surfaces as a crash the first time a caller reaches it. Either implement the code or remove
# the placeholder before it ships.
id: no-todo-throws
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  # grandfather entries are per-repo; installs append their own
message: "no-todo-throws: TODO() throws NotImplementedError at runtime. Implement the code or remove the placeholder."
rule:
  any:
    - pattern: TODO()
    - pattern: TODO($$$MSG)
