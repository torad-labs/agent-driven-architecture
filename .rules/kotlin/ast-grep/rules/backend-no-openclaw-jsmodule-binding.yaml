id: backend-no-openclaw-jsmodule-binding
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  # grandfather entries are per-repo; installs append their own
message: "backend-no-openclaw-jsmodule-binding: backend code must not bind the OpenClaw npm package; the dependency arrow is plugin to backend."
rule:
  all:
    - kind: constructor_invocation
    - has:
        kind: type_identifier
        regex: "^JsModule$"
        stopBy: end
    - has:
        kind: string_content
        regex: "^openclaw(/.*)?$"
        stopBy: end
