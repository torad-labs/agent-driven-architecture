# TENET (Marcos #324.1/.5, operator directive 2026-07-13): dispatch rides SEALED types and
# enums with compiler-checked exhaustiveness — never a `when` over string literals, which is
# open-world dispatch: a new case is a silent fall-through, not a compile error. Wire/CLI
# tokens get a closed enum with a single fromToken() seam; parsers over genuinely external
# text declare themselves in the ignores below (a conscious zone, not a default).
id: no-stringly-when-dispatch
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  # grandfather entries are per-repo; installs append their own
  # per-repo: src/test/fixtures/ is HARNESS DATA, not source — detekt/konsist read it
  # as text and Gradle never compiles it (no srcDir declares it). violating/ fixtures
  # exist in order to violate; scanning them is a category error.
  - "**/src/test/fixtures/**"
rule:
  kind: when_expression
  all:
    - has:
        kind: when_subject
    - has:
        kind: when_entry
        has:
          kind: when_condition
          has:
            kind: string_literal
            stopBy: end
