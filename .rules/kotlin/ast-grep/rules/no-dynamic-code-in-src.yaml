id: no-dynamic-code-in-src
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  # grandfather entries are per-repo; installs append their own
message: "no-dynamic-code-in-src: the OpenClaw scanner's dynamic-code-execution rule fires unconditionally on an eval( call in dist/, with no node_modules exemption. Express this without eval — a lookup table, a sealed dispatch, or a typed parser."
rule:
  pattern: eval($$$ARGS)
