id: no-retired-route-setters
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  # grandfather entries are per-repo; installs append their own
message: "no-retired-route-setters: retired Route callback globals must stay behind InboundRuntime and InboundPorts."
rule:
  kind: simple_identifier
  regex: "^(setMediaDeliveryDiagnosisProvider|setRenameEnqueuer|setPasteEnqueuer|setCoalesceFlushHandler|setUndoHandler|setSummaryHandler|setDigestHandler|setSpawnHandler|setOperatorRoomTopicIdProvider|setOperatorRoomHandler|setBroadcastHandler|setCleanupHandler|setInboundSeen|setInboundUnsee)$"
