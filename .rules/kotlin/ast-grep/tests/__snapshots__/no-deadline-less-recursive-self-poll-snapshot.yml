    private fun waitFor(predicate: () -> Boolean): Promise<Boolean> {
        fun poll(): Promise<Boolean> =
            when {
                predicate() -> Promise.resolve(true)
                else -> sleep(intervalMs).then { poll() }.unsafeCast<Promise<Boolean>>()
            }
        return poll()
    }
