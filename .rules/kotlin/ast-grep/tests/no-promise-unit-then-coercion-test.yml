  # verb handler) — must be caught now that the glob covers backend/seatd AND the modifier gap is
  # closed. Before SP-12: invisible twice over (wrong glob, then wrong modifier-anchoring).
  - |
    package bad

    private fun handleSpawnVerbSeatd(seat: String): Promise<Unit> =
        ptyBackend.spawn(seat).then { handle -> registerHandle(seat, handle) }
  # SP-12: the same coercion in an internal fun block-body return, one more realistic seatd shape.
